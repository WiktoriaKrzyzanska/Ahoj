<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ahoj! — Find your tribe in Łódź</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --cream: #F7F1E8;
    --cream-deep: #EFE5D5;
    --cream-soft: #FAF5EC;
    --terracotta: #B8542B;
    --terracotta-deep: #9A4421;
    --terracotta-soft: #E8C9B5;
    --sage: #6B7E50;
    --sage-deep: #4E5E3B;
    --sage-soft: #C9D2B5;
    --ink: #2A1F17;
    --ink-soft: #4A3B2C;
    --ink-faded: #5E4D3B;
    --rose: #E8C9C9;
    --error: #B83838;
    --error-soft: #F5DCDC;
    --warning: #C97A1F;
    --shadow: rgba(184, 84, 43, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--cream);
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #root {
    min-height: 100vh;
    display: flex;
  }

  .phone {
    width: 100%;
    background: var(--cream);
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 900px) {
    #root {
      align-items: stretch;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(184, 84, 43, 0.04), transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(107, 126, 80, 0.04), transparent 50%),
        var(--cream-soft);
    }
    .phone {
      max-width: 480px;
      min-height: 100vh;
      box-shadow: 0 0 60px -20px rgba(42, 31, 23, 0.15);
    }
  }

  button:focus-visible,
  [role="button"]:focus-visible,
  [role="checkbox"]:focus-visible,
  a:focus-visible,
  input:focus-visible,
  .chip:focus-visible,
  .filter-chip:focus-visible,
  .event-card:focus-visible,
  .pin:focus-visible,
  .tab:focus-visible,
  .nav-item:focus-visible,
  .profile-list-item:focus-visible,
  .consent-row:focus-visible,
  .similar-card:focus-visible,
  .social-btn:focus-visible {
    outline: 2px solid var(--terracotta);
    outline-offset: 2px;
    border-radius: 8px;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    z-index: 999;
    padding: 8px 16px;
    background: var(--ink);
    color: var(--cream);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .skip-link:focus {
    left: 16px;
    top: 16px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  .status-bar { display: none; }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px 0;
    padding-top: max(12px, env(safe-area-inset-top));
    min-height: 48px;
    flex-shrink: 0;
  }

  .nav-back {
    background: transparent; border: none; cursor: pointer;
    color: var(--ink-soft); padding: 12px; margin-left: -8px;
    border-radius: 50%; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px;
  }
  .nav-back:hover { background: var(--cream-deep); color: var(--terracotta); }

  .logo {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 600;
    font-size: 22px; color: var(--terracotta); letter-spacing: -0.5px;
  }

  .lang-switch {
    display: flex; background: var(--cream-deep); border-radius: 100px;
    padding: 3px; font-size: 11px; font-weight: 600;
  }
  .lang-switch button {
    background: transparent; border: none; padding: 8px 14px;
    border-radius: 100px; cursor: pointer; color: var(--ink-faded);
    font-family: inherit; font-weight: inherit; transition: all 0.2s;
    letter-spacing: 0.5px; min-height: 32px;
  }
  .lang-switch button.active { background: var(--terracotta); color: var(--cream); }

  .progress { display: flex; gap: 6px; padding: 16px 32px 8px; flex-shrink: 0; }
  .progress-step {
    flex: 1; height: 3px; background: var(--cream-deep);
    border-radius: 100px; overflow: hidden; position: relative;
  }
  .progress-step.done { background: var(--sage); }
  .progress-step.active::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--terracotta), var(--terracotta-deep));
    animation: progressFill 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    transform-origin: left;
  }
  @keyframes progressFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .screen {
    flex: 1; padding: 8px 32px 28px;
    display: flex; flex-direction: column;
    animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    min-height: calc(100vh - 60px);
  }
  .screen::-webkit-scrollbar { width: 0; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .screen-title {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px;
    line-height: 1.15; color: var(--terracotta-deep);
    text-align: center; margin-top: 16px; letter-spacing: -0.5px;
  }
  .screen-title em { font-style: italic; color: var(--terracotta); }

  .screen-subtitle {
    font-size: 14px; color: var(--ink-soft); text-align: center;
    margin-top: 12px; line-height: 1.5; max-width: 320px; align-self: center;
  }

  .welcome-art { position: relative; width: 220px; height: 220px; margin: 12px auto 0; }
  .blob { position: absolute; box-shadow: 0 20px 50px -10px var(--shadow); }
  .blob-1 {
    width: 150px; height: 170px; top: 8px; right: 0;
    background: linear-gradient(135deg, var(--terracotta-soft), var(--terracotta));
    border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
    transform: rotate(-8deg); animation: float1 6s ease-in-out infinite;
  }
  .blob-2 {
    width: 120px; height: 140px; bottom: 8px; left: 0;
    background: linear-gradient(135deg, var(--sage-soft), var(--sage));
    border-radius: 50% 60% 40% 50% / 60% 40% 60% 40%;
    transform: rotate(12deg); animation: float2 7s ease-in-out infinite;
  }
  .blob-3 {
    width: 70px; height: 70px; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, var(--cream-soft), var(--rose));
    border-radius: 50%; box-shadow: 0 10px 30px -5px var(--shadow);
    animation: pulse 4s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
  }
  .blob-3-inner { color: var(--terracotta); font-size: 26px; }
  @keyframes float1 { 0%,100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(-5deg) translateY(-8px); } }
  @keyframes float2 { 0%,100% { transform: rotate(12deg) translateY(0); } 50% { transform: rotate(9deg) translateY(8px); } }
  @keyframes pulse { 0%,100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } }

  .hero-text { text-align: center; margin: 12px 0 20px; }
  .hero-text h1 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 34px;
    line-height: 1.05; color: var(--terracotta-deep); letter-spacing: -1px;
  }
  .hero-text h1 em { font-style: italic; }
  .hero-text .subtitle {
    font-family: 'Fraunces', serif; font-size: 13px; color: var(--ink-faded);
    margin-top: 6px; font-style: italic; letter-spacing: 0.3px;
  }

  .form-group { margin-bottom: 14px; position: relative; }
  .form-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; color: var(--ink-faded);
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px;
  }
  .form-label-info {
    background: transparent; border: none; cursor: pointer;
    color: var(--ink-faded); padding: 2px;
    display: inline-flex; align-items: center;
    border-radius: 50%; min-width: 20px; min-height: 20px;
    justify-content: center;
  }
  .form-label-info:hover { color: var(--terracotta); background: var(--cream-deep); }
  .form-input {
    width: 100%; padding: 14px 18px; background: var(--cream-soft);
    border: 1.5px solid transparent; border-radius: 14px;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    color: var(--ink); transition: all 0.2s;
  }
  .form-input::placeholder { color: var(--ink-faded); }
  .form-input:focus {
    outline: none; border-color: var(--terracotta); background: var(--cream);
    box-shadow: 0 0 0 4px rgba(184, 84, 43, 0.1);
  }
  .form-input.valid {
    border-color: var(--sage); padding-right: 44px;
  }
  .form-input.error {
    border-color: var(--error); background: var(--error-soft);
  }
  .form-input.has-toggle { padding-right: 52px; }

  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear,
  input[type="password"]::-webkit-credentials-auto-fill-button,
  input[type="password"]::-webkit-caps-lock-indicator,
  input[type="password"]::-webkit-reveal {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
    width: 0 !important;
    height: 0 !important;
  }
  .input-icon {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    pointer-events: none;
  }
  .input-icon.below-label { top: calc(50% + 14px); }
  .password-input-wrap { position: relative; }
  .pwd-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; min-width: 38px; min-height: 38px;
    background: transparent; border: none; cursor: pointer;
    color: var(--ink-faded); padding: 0; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 0;
  }
  .pwd-toggle svg { width: 20px; height: 20px; display: block; flex-shrink: 0; }
  .password-input-wrap .pwd-toggle { z-index: 3; }
  .pwd-toggle.with-label { top: 50%; }
  .pwd-toggle:hover { color: var(--terracotta); background: var(--cream-deep); }
  .form-error {
    font-size: 13px; color: var(--error); margin-top: 6px;
    display: flex; align-items: center; gap: 4px; font-weight: 500;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .pwd-strength {
    margin-top: 8px;
    background: var(--cream-soft); border-radius: 12px;
    padding: 12px; border: 1px solid var(--cream-deep);
  }
  .pwd-strength-bar {
    display: flex; gap: 4px; margin-bottom: 8px;
  }
  .pwd-strength-bar-seg {
    flex: 1; height: 4px; border-radius: 100px;
    background: var(--cream-deep); transition: background 0.3s;
  }
  .pwd-strength-bar-seg.weak { background: var(--error); }
  .pwd-strength-bar-seg.medium { background: var(--warning); }
  .pwd-strength-bar-seg.strong { background: var(--sage); }
  .pwd-strength-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .pwd-strength-label.weak { color: var(--error); }
  .pwd-strength-label.medium { color: var(--warning); }
  .pwd-strength-label.strong { color: var(--sage-deep); }
  .pwd-checklist { list-style: none; }
  .pwd-checklist li {
    font-size: 12px; color: var(--ink-faded); line-height: 1.4;
    padding: 3px 0 3px 22px; position: relative;
    transition: color 0.2s;
  }
  .pwd-checklist li::before {
    content: '○'; position: absolute; left: 4px; top: 3px;
    color: var(--ink-faded); font-weight: 700; transition: color 0.2s;
  }
  .pwd-checklist li.met { color: var(--sage-deep); }
  .pwd-checklist li.met::before { content: '✓'; color: var(--sage); }

  .info-tooltip {
    position: absolute; z-index: 30;
    background: var(--ink); color: var(--cream);
    padding: 10px 14px; border-radius: 12px;
    font-size: 12px; line-height: 1.4;
    max-width: 260px; min-width: 200px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 0.2s ease;
  }
  .info-tooltip::before {
    content: ''; position: absolute;
    top: -6px; left: 14px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 6px solid var(--ink);
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; border-radius: 100px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
    border: none; cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 0.2px;
    min-height: 48px;
  }
  .btn-primary {
    background: var(--terracotta); color: var(--cream);
    box-shadow: 0 8px 20px -8px var(--terracotta);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--terracotta-deep); transform: translateY(-1px);
    box-shadow: 0 12px 24px -8px var(--terracotta);
  }
  .btn-primary:disabled {
    background: var(--cream-deep); color: var(--ink-faded);
    cursor: not-allowed; box-shadow: none;
  }
  .btn-primary.loading { pointer-events: none; }
  .btn-secondary {
    background: transparent; color: var(--ink); border: 1.5px solid var(--ink);
  }
  .btn-secondary:hover { background: var(--ink); color: var(--cream); }
  .btn-ghost {
    background: var(--cream-deep); color: var(--ink-soft);
  }
  .btn-ghost:hover { background: var(--terracotta-soft); color: var(--terracotta-deep); }
  .btn-danger {
    background: var(--error); color: var(--cream);
  }
  .btn-danger:hover { background: #962d2d; }

  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(247, 241, 232, 0.3);
    border-top-color: var(--cream);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .auth-divider {
    display: flex; align-items: center; gap: 12px; margin: 18px 0 14px;
    font-size: 11px; color: var(--ink-faded); letter-spacing: 1px;
    text-transform: uppercase; font-weight: 600;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--cream-deep);
  }

  .social-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  .social-btn {
    padding: 12px; background: var(--cream-soft);
    border: 1.5px solid var(--cream-deep); border-radius: 14px;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink); min-height: 48px;
  }
  .social-btn:hover { border-color: var(--terracotta); transform: translateY(-1px); }

  .signup-link {
    text-align: center; font-size: 14px; color: var(--ink-soft); margin-top: 14px;
  }
  .signup-link a {
    color: var(--terracotta); font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .signup-link a:hover { text-decoration: underline; }

  .footer { margin-top: auto; padding-top: 16px; }
  .helper-text {
    font-size: 13px; color: var(--ink-faded);
    text-align: center; margin-top: 12px;
  }

  .toast {
    position: absolute; top: 70px; left: 50%;
    transform: translateX(-50%); z-index: 100;
    background: var(--ink); color: var(--cream);
    padding: 12px 18px; border-radius: 100px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex; align-items: center; gap: 8px;
    animation: toastIn 0.3s ease;
    max-width: 90%;
  }
  .toast.error { background: var(--error); }
  .toast.success { background: var(--sage-deep); }
  .toast-close {
    background: transparent; border: none; color: inherit;
    cursor: pointer; padding: 4px; margin-left: 4px;
    border-radius: 50%; opacity: 0.8;
    display: flex; align-items: center;
  }
  .toast-close:hover { opacity: 1; background: rgba(255,255,255,0.15); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .greeting-overlay {
    position: absolute; inset: 0; background: var(--cream); z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 32px; text-align: center;
    cursor: pointer;
  }
  .greeting-overlay.fading {
    animation: greetingFade 0.4s ease forwards;
  }
  @keyframes greetingFade {
    to { opacity: 0; visibility: hidden; }
  }
  .greeting-text {
    font-family: 'Fraunces', serif; font-style: italic;
    font-size: 32px; color: var(--terracotta-deep); font-weight: 500;
    letter-spacing: -0.5px; line-height: 1.2;
    animation: greetingIn 0.5s ease;
  }
  @keyframes greetingIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .greeting-text em { color: var(--terracotta); }
  .greeting-skip {
    margin-top: 24px; font-size: 12px; color: var(--ink-faded);
    letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
  }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    padding: 12px 18px; background: var(--cream-soft);
    border: 1.5px solid var(--cream-deep); border-radius: 100px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--ink); cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px;
  }
  .chip:hover { border-color: var(--terracotta-soft); }
  .chip[aria-pressed="true"] { background: var(--terracotta); border-color: var(--terracotta); color: var(--cream); }

  .age-display {
    background: var(--cream-soft); border-radius: 24px;
    padding: 24px; text-align: center; margin: 16px 0;
  }
  .age-stepper {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 8px;
  }
  .age-step-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--cream); border: 1.5px solid var(--cream-deep);
    color: var(--terracotta-deep); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 300; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .age-step-btn:hover:not(:disabled) {
    background: var(--terracotta); color: var(--cream); border-color: var(--terracotta);
  }
  .age-step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .age-input {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 56px;
    line-height: 1; color: var(--terracotta-deep); letter-spacing: -2px;
    text-align: center; width: 110px; background: transparent;
    border: none; outline: none; padding: 0;
  }
  .age-input::-webkit-outer-spin-button,
  .age-input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .age-input { -moz-appearance: textfield; }
  .age-label {
    font-size: 11px; color: var(--ink-faded); letter-spacing: 2px;
    text-transform: uppercase; margin-top: 6px; font-weight: 700;
  }

  .photo-upload {
    background: var(--cream-soft); border: 2px dashed var(--terracotta-soft);
    border-radius: 24px; padding: 28px 24px; text-align: center;
    cursor: pointer; transition: all 0.2s; margin: 12px 0;
  }
  .photo-upload:hover { border-color: var(--terracotta); background: var(--cream); }
  .photo-upload.uploaded {
    border-style: solid; border-color: var(--sage); background: var(--cream);
  }
  .photo-circle {
    width: 72px; height: 72px; margin: 0 auto 12px;
    background: var(--terracotta-soft); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--terracotta-deep); font-size: 28px;
  }
  .photo-text { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .photo-hint { font-size: 13px; color: var(--ink-faded); }

  .verify-box {
    background: var(--cream-soft); border-radius: 24px;
    padding: 22px 24px; text-align: center; margin: 12px 0;
    position: relative; overflow: hidden;
  }
  .verify-box::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--sage-soft), transparent 70%);
    opacity: 0.5;
  }
  .verify-content { position: relative; }
  .verify-emoji {
    font-size: 40px; margin-bottom: 8px;

      <div key={i}

const Toast = ({ message, type = 'error', onDone, lang }) => {
  useEffect(() => {
    const timer = setTimeout(onDone, 4000);
    return () => clearTimeout(timer);
  }, []);
  return (
    <div className={`toast ${type}`} role="alert" aria-live={type === 'error' ? 'assertive' : 'polite'}>
      {type === 'error' && <Icon.X />}
      {type === 'success' && <Icon.Check />}
      <span>{message}</span>
      <button className="toast-close" onClick={onDone} aria-label={lang === 'pl' ? 'Zamknij' : 'Close'}>
        <Icon.X />
      </button>
    </div>
  );
};

const InfoTooltip = ({ open, text, onClose }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div ref={ref} className="info-tooltip" style={{top: 26, left: 0}} role="tooltip">
      {text}
    </div>
  );
};

const checkPasswordRequirements = (pwd) => ({
  length: pwd.length >= 8,
  upper: /[A-Z]/.test(pwd),
  lower: /[a-z]/.test(pwd),
  number: /[0-9]/.test(pwd)
});

const passwordStrength = (pwd) => {
  if (!pwd) return 0;
  const reqs = checkPasswordRequirements(pwd);
  const met = Object.values(reqs).filter(Boolean).length;
  if (met <= 1) return 1;
  if (met <= 3) return 2;
  return pwd.length >= 12 ? 3 : 2;
};

const PasswordStrength = ({ password, lang }) => {
  const c = t[lang].signup;
  const reqs = checkPasswordRequirements(password);
  const strength = passwordStrength(password);
  const label = strength === 1 ? c.pwdStrengthWeak : strength === 2 ? c.pwdStrengthMedium : c.pwdStrengthStrong;
  const labelClass = strength === 1 ? 'weak' : strength === 2 ? 'medium' : 'strong';

  return (
    <div className="pwd-strength" aria-live="polite">
      <div className="pwd-strength-bar" aria-hidden="true">
        <div className={`pwd-strength-bar-seg ${strength >= 1 ? labelClass : ''}`} />
        <div className={`pwd-strength-bar-seg ${strength >= 2 ? labelClass : ''}`} />
        <div className={`pwd-strength-bar-seg ${strength >= 3 ? labelClass : ''}`} />
      </div>

const PhotoVerifyScreen = ({ data, setData, onNext, onBack, lang, setLang }) => {
  const c = t[lang].photo;
  const [counting, setCounting] = useState(false);
  const [seconds, setSeconds] = useState(3);
  const [showWhy, setShowWhy] = useState(false);

  useEffect(() => {
    if (!counting) return;
    if (seconds === 0) {
      setData({...data, verified: true});
      setCounting(false);
      return;
    }
    const timer = setTimeout(() => setSeconds(s => s - 1), 1000);
    return () => clearTimeout(timer);
  }, [counting, seconds]);

  const radius = 32;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference * (1 - seconds / 3);

  const canContinue = data.hasPhoto && data.verified;

  return (
    <>
      <Nav onBack={onBack} lang={lang} setLang={setLang} />
      <Progress step={3} total={4} lang={lang} />

          className={`photo-upload ${data.hasPhoto ? 'uploaded' : ''}`}

          style={{display: 'block', width: '100%', fontFamily: 'inherit'}}
          aria-pressed={data.hasPhoto}>
          {data.hasPhoto ? (
            <>
              <div className="photo-circle" style={{background: 'var(--sage)', color: 'var(--cream)'}}>
                <Icon.CheckLarge />

              <div className="photo-text">{c.uploaded}</div>

            <>
              <div className="photo-circle"><Icon.Upload /></div>
              <div className="photo-text">{c.upload}</div>
              <div className="photo-hint">{c.hint}</div>

        {data.hasPhoto && (
          <>
            <h3 style={{fontFamily: 'Fraunces, serif', fontSize: 17, fontWeight: 500, color: 'var(--ink)', marginTop: 16, marginBottom: 4, textAlign: 'center'}}>

                <div className="verify-emoji" aria-hidden="true">✌️</div>

                {counting ? (
                  <div className="verify-status checking" role="status" aria-live="polite">
                    <span className="spinner" aria-hidden="true"></span>
                    {c.checking}
                  </div>
                ) : data.verified ? (
                  <div className="verify-status" role="status" aria-live="polite">
                    <Icon.CheckLarge />
                    {c.verifiedOk}

                ) : (
                  <button className="btn btn-secondary" style={{maxWidth: 200, margin: '0 auto'}}
                    onClick={() => { setSeconds(3); setCounting(true); }}>

            </div>

            <div className="info-card">
              <div className="info-card-icon"><Icon.Shield /></div>
              <div className="info-card-text">{c.verifyInfo}</div>

        {!data.hasPhoto && (

            <div className="info-card-text">{c.privacy}</div>

const InterestsConsentsScreen = ({ data, setData, onNext, onBack, lang, setLang }) => {
  const c = t[lang].interests;
  const [rulesOpen, setRulesOpen] = useState(false);
  const [rulesRead, setRulesRead] = useState(false);
  const [termsRead, setTermsRead] = useState(false);
  const [activeDoc, setActiveDoc] = useState(null);
  const cats = [
    { id: 'creative', title: c.creative, iconClass: 'creative', icon: '✿', items: lang === 'pl'
      ? ['Fotografia', 'Pisanie', 'Ceramika', 'Malarstwo', 'Sztuka cyfrowa']
      : ['Photography', 'Writing', 'Pottery', 'Painting', 'Digital Art'] },
    { id: 'active', title: c.active, iconClass: 'active', icon: '◆', items: lang === 'pl'
      ? ['Joga', 'Wędrówki', 'Rower', 'Bieganie', 'Pływanie']
      : ['Yoga', 'Hiking', 'Cycling', 'Running', 'Swimming'] },
    { id: 'music', title: c.music, iconClass: 'music', icon: '♪', items: lang === 'pl'
      ? ['Indie Pop', 'Jazz', 'Podcasty', 'Klasyka', 'Lo-Fi']
      : ['Indie Pop', 'Jazz', 'Podcasts', 'Classical', 'Lo-Fi Beats'] }
  ];

  const toggleInterest = (item) => {
    const newSet = data.interests.includes(item)
      ? data.interests.filter(i => i !== item)
      : data.interests.length < 10 ? [...data.interests, item] : data.interests;
    setData({...data, interests: newSet});
  };

  const openMissingRequiredStep = () => {
    if (!rulesRead) { setRulesOpen(true); setRulesRead(true); return true; }
    if (!termsRead) { setActiveDoc('terms'); return true; }
    return false;
  };

  const acceptAllRequired = () => {
    if (openMissingRequiredStep()) return;
    setData({...data, consentTerms: true, consentRodo: true});
  };

  const toggleTermsConsent = () => {
    if (openMissingRequiredStep()) return;
    setData({...data, consentTerms: !data.consentTerms});
  };

  const interestsValid = data.interests.length >= 3 && data.interests.length <= 10;
  const valid = interestsValid && rulesRead && termsRead && data.consentTerms && data.consentRodo;

  return (
    <>
      <Nav onBack={onBack} lang={lang} setLang={setLang} />
      <Progress step={4} total={4} lang={lang} />

        <h2 className="screen-title">{c.title} <em>{c.titleEm}</em></h2>
        <p className="screen-subtitle">{c.subtitle}</p>

        <div style={{marginTop: 18}}>
          {cats.map(cat => (
            <div key={cat.id} className="interest-cat">
              <div className="interest-header">
                <div className={`interest-icon ${cat.iconClass}`} aria-hidden="true">{cat.icon}</div>
                <div className="interest-title">{cat.title}</div>
              </div>
              <div className="chip-row" role="group" aria-label={cat.title}>
                {cat.items.map(item => (
                  <button key={item} type="button"
                    className="chip"
                    aria-pressed={data.interests.includes(item)}
                    onClick={() => toggleInterest(item)}>
                    {item}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>

        <div className="helper-text" style={{marginTop: 4, marginBottom: 16}} aria-live="polite">
          {data.interests.length} / 10 {c.selected}
        </div>

        <div style={{marginTop: 4}}>
          <div className={`accordion`} aria-expanded={rulesOpen}>
            <button className="accordion-header" onClick={() => { setRulesOpen(!rulesOpen); if (!rulesOpen) setRulesRead(true); }} aria-expanded={rulesOpen}>
              <span><Icon.Shield /> {c.rulesTitle}</span>
              <span className="accordion-icon"><Icon.ChevronDown /></span>
            </button>
            {rulesOpen && (
              <div className="accordion-content">
                <ul>
                  <li>{c.rule1}</li>
                  <li>{c.rule2}</li>
                  <li>{c.rule3}</li>
                  <li>{c.rule4}</li>
                </ul>
                <div className="consent-note">✓ {c.rulesRead}</div>
              </div>
            )}
          </div>

          <div className={`consent-row ${(!rulesRead || !termsRead) ? 'needs-action' : ''}`} onClick={toggleTermsConsent} onKeyDown={handleKeyClick(toggleTermsConsent)} tabIndex={0} role="checkbox" aria-checked={data.consentTerms}>
            <div className="checkbox" aria-checked={data.consentTerms} aria-hidden="true">
              {data.consentTerms && <Icon.Check />}
            </div>
            <div className="consent-text">
              {c.terms} <button type="button" className="consent-link" style={{background:'none', border:0, fontFamily:'inherit', fontSize:'inherit'}} onClick={e => { e.stopPropagation(); if (!rulesRead) { setRulesOpen(true); setRulesRead(true); } else { setActiveDoc('terms'); } }}>{c.termsLink}</button> {c.and} <button type="button" className="consent-link" style={{background:'none', border:0, fontFamily:'inherit', fontSize:'inherit'}} onClick={e => { e.stopPropagation(); setActiveDoc('privacy'); }}>{c.privacy}</button>.

            </div>
          </div>

          {lang === 'pl' ? 'Odkrywaj' : 'Explore'}
        </h1>
        <p className="screen-subtitle" style={{textAlign: 'left', marginTop: 6, alignSelf: 'flex-start'}}>
          {lang === 'pl' ? 'Wszystkie wydarzenia w Łodzi' : 'All events happening in Łódź'}
        </p>
        <div style={{marginTop: 16}}>
          {events.map(ev => (
            <button key={ev.id} type="button" className="event-card" onClick={() => onPinClick(ev)}>
              <div className={`event-card-icon ${ev.cover === 'green' ? 'sage' : ''}`} aria-hidden="true">{ev.icon}</div>
              <div className="event-card-info">
                <div className="event-card-title">{ev.title}</div>
                <div className="event-card-meta">
                  {ev.location} · {ev.date}
                  <span className="event-card-tag">{ev.seats}</span>
                </div>
              </div>
            </button>
          ))}
        </div>
      </main>
      <BottomNav active={activeTab} onTab={onTabChange} lang={lang} />
    </div>
  );
};

const BottomNav = ({ active, onTab, lang }) => {
  const n = t[lang].nav;
  const items = [
    { id: 'map', icon: <Icon.Map />, label: n.map },
    { id: 'explore', icon: <Icon.Compass />, label: n.explore },
    { id: 'saved', icon: <Icon.BookmarkNav />, label: n.saved },
    { id: 'profile', icon: <Icon.User />, label: n.profile }
  ];
  return (
    <nav className="bottom-nav" aria-label={lang === 'pl' ? 'Główna nawigacja' : 'Main navigation'}>
      {items.map(item => (
        <button key={item.id} type="button"
          className="nav-item"
          aria-current={active === item.id ? 'page' : undefined}
          onClick={() => onTab(item.id)}>
          {item.icon}
          <span className="nav-label">{item.label}</span>
        </button>
      ))}
    </nav>
  );
};

const useFocusTrap = (ref, active) => {
  useEffect(() => {
    if (!active || !ref.current) return;
    const focusable = ref.current.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    first && first.focus();
    const handler = (e) => {
      if (e.key === 'Escape') {
        const closeBtn = ref.current.querySelector('[data-modal-close]');
        if (closeBtn) closeBtn.click();
      }
      if (e.key !== 'Tab') return;
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [active]);
};

const JoinedModal = ({ event, onView, onClose, lang }) => {
  const c = t[lang].joined;
  const ref = useRef(null);
  useFocusTrap(ref, true);
  return (
    <div className="modal-overlay" onClick={onClose} role="dialog" aria-modal="true" aria-labelledby="joined-title">
      <div className="modal" onClick={e => e.stopPropagation()} ref={ref}>
        <div className="modal-icon" aria-hidden="true"><Icon.CheckLarge /></div>
        <div className="modal-title" id="joined-title">{c.title}</div>
        <div className="modal-text">{c.text}</div>
        <button className="btn btn-primary" onClick={onView} style={{marginBottom: 8}}>{c.view}</button>
        <button className="btn btn-ghost" onClick={onClose} data-modal-close>{c.back}</button>
      </div>
    </div>
  );
};

const LogoutModal = ({ onConfirm, onCancel, lang }) => {
  const c = t[lang].profile;
  const ref = useRef(null);
  useFocusTrap(ref, true);
  return (
    <div className="modal-overlay" onClick={onCancel} role="dialog" aria-modal="true" aria-labelledby="logout-title">
      <div className="modal" onClick={e => e.stopPropagation()} ref={ref}>
        <div className="modal-icon danger" aria-hidden="true"><Icon.LogOut /></div>
        <div className="modal-title" id="logout-title">{c.logoutTitle}</div>
        <div className="modal-text">{c.logoutText}</div>
        <button className="btn btn-danger" onClick={onConfirm} style={{marginBottom: 8}}>{c.logoutConfirmBtn}</button>
        <button className="btn btn-ghost" onClick={onCancel} data-modal-close>{c.logoutCancel}</button>
      </div>
    </div>
  );
};

const App = () => {
  const [stage, setStage] = useState('welcome');
  const [step, setStep] = useState(0);
  const [lang, setLang] = useState('en');
  const [appTab, setAppTab] = useState('map');
  const [selectedEvent, setSelectedEvent] = useState(null);
  const [joinedEvents, setJoinedEvents] = useState([]);
  const [showJoinModal, setShowJoinModal] = useState(false);
  const [showLogoutModal, setShowLogoutModal] = useState(false);
  const [showGreeting, setShowGreeting] = useState(false);
  const [greetingFading, setGreetingFading] = useState(false);
  const [greetingText, setGreetingText] = useState('');
  const [toast, setToast] = useState(null);
  const [fontSize, setFontSize] = useState('normal');
  const [theme, setTheme] = useState('light');
  const [savedEvents, setSavedEvents] = useState([]);

  useEffect(() => {
    document.documentElement.lang = lang;
  }, [lang]);

  const initialData = {
    firstName: '', lastName: '',
    email: '', password: '',
    gender: null, age: 28,
    hasPhoto: false, verified: false,
    interests: [],
    consentTerms: false, consentRodo: false, consentMarketing: false
  };
  const [data, setData] = useState(initialData);

  const showToast = (message, type = 'error') => setToast({ message, type });

  const triggerGreeting = (text, after) => {
    setGreetingText(text);
    setShowGreeting(true);
    setGreetingFading(false);
    const fadeTimer = setTimeout(() => setGreetingFading(true), 2000);
    const doneTimer = setTimeout(() => {
      setShowGreeting(false);
      setGreetingFading(false);
      after();
    }, 2400);
    return () => {
      clearTimeout(fadeTimer);
      clearTimeout(doneTimer);
    };
  };

  const skipGreeting = () => {
    setGreetingFading(true);
    setTimeout(() => {
      setShowGreeting(false);
      setGreetingFading(false);
      setStage('app');
    }, 200);
  };

  const handleLoginSuccess = (email) => {
    const fakeFirst = email.split('@')[0].split('.')[0];
    const greeting = `${t[lang].auth.welcome} ${fakeFirst.charAt(0).toUpperCase() + fakeFirst.slice(1)}`;
    setData({...data, firstName: fakeFirst.charAt(0).toUpperCase() + fakeFirst.slice(1), lastName: 'Demo'});
    triggerGreeting(greeting, () => setStage('app'));
  };

  const handleStartSignup = () => { setStage('onboarding'); setStep(0); };

  const onboardingScreens = [
    <SignupScreen data={data} setData={setData} onNext={() => setStep(1)} onBack={() => setStage('welcome')} lang={lang} setLang={setLang} showToast={showToast} />,
    <GenderAgeScreen data={data} setData={setData} onNext={() => setStep(2)} onBack={() => setStep(0)} lang={lang} setLang={setLang} />,
    <PhotoVerifyScreen data={data} setData={setData} onNext={() => setStep(3)} onBack={() => setStep(1)} lang={lang} setLang={setLang} />,
    <InterestsConsentsScreen data={data} setData={setData} onNext={() => setStep(4)} onBack={() => setStep(2)} lang={lang} setLang={setLang} />,
    <DoneScreen onEnter={() => {
      setStage('app');
      showToast(`${t[lang].signup.hello} ${data.firstName}`, 'success');
    }} lang={lang} setLang={setLang} />
  ];

  const handleJoinEvent = () => {
    if (!joinedEvents.find(e => e.id === selectedEvent.id)) {
      setJoinedEvents([...joinedEvents, selectedEvent]);
    }
    setShowJoinModal(true);
  };

  const handleLogoutConfirm = () => {
    setShowLogoutModal(false);
    setStage('welcome');
    setData(initialData);
    setStep(0);
    setJoinedEvents([]);
    setSavedEvents([]);
    setAppTab('map');
    setSelectedEvent(null);
    showToast(t[lang].profile.logoutConfirm, 'success');
  };

  let content;
  if (stage === 'welcome') {
    content = <WelcomeScreen
      onSignup={handleStartSignup}
      onLogin={handleLoginSuccess}
      lang={lang} setLang={setLang}
      showToast={showToast} />;
  } else if (stage === 'onboarding') {
    content = onboardingScreens[step];
  } else {
    if (selectedEvent) {
      content = <EventDetail
        event={selectedEvent}
        onBack={() => setSelectedEvent(null)}
        onJoin={handleJoinEvent}
        lang={lang}
        savedEvents={savedEvents}
        onToggleSave={(event) => setSavedEvents(prev => prev.some(e => e.id === event.id) ? prev.filter(e => e.id !== event.id) : [...prev, event])}
        showToast={showToast} />;
    } else if (appTab === 'map') {
      content = <MapScreen
        onPinClick={(ev) => setSelectedEvent(ev)}
        onTabChange={setAppTab}
        activeTab={appTab}
        lang={lang} />;
    } else if (appTab === 'explore') {
      content = <ExploreScreen
        onTabChange={setAppTab}
        activeTab={appTab}
        lang={lang}
        onPinClick={(ev) => setSelectedEvent(ev)}
        onBack={() => setAppTab('map')} />;
    } else if (appTab === 'saved') {
      content = <SavedScreen
        onTabChange={setAppTab}
        activeTab={appTab}
        lang={lang}
        joinedEvents={joinedEvents}
        savedEvents={savedEvents}
        onPinClick={(ev) => setSelectedEvent(ev)}
        onBack={() => setAppTab('map')} />;
    } else if (appTab === 'profile') {
      content = <ProfileScreen
        onTabChange={setAppTab}
        activeTab={appTab}
        lang={lang} setLang={setLang}
        userData={data}
        onLogoutRequest={() => setShowLogoutModal(true)}
        joinedCount={joinedEvents.length}
        fontSize={fontSize}
        setFontSize={setFontSize}
        theme={theme}
        setTheme={setTheme}
        onBack={() => setAppTab('map')} />;
    }
  }

  return (
    <div className={`phone ${fontSize === 'large' ? 'font-large' : ''}`} data-theme={theme}>
      {content}
      {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} lang={lang} />}
      {showGreeting && (
        <div className={`greeting-overlay ${greetingFading ? 'fading' : ''}`}
          onClick={skipGreeting}
          role="button"
          tabIndex={0}
          onKeyDown={handleKeyClick(skipGreeting)}
          aria-label={t[lang].skip}>
          <div className="greeting-text" dangerouslySetInnerHTML={{
            __html: greetingText.replace(/^(.+?)(\s+\w+)$/, '$1<em>$2</em>')
          }}></div>
          <div className="greeting-skip">{t[lang].skip}</div>
        </div>
      )}
      {showJoinModal && (
        <JoinedModal
          event={selectedEvent}
          lang={lang}
          onView={() => {
            setShowJoinModal(false);
            setSelectedEvent(null);
            setAppTab('saved');
          }}
          onClose={() => {
            setShowJoinModal(false);
            setSelectedEvent(null);
          }} />
      )}
      {showLogoutModal && (
        <LogoutModal
          lang={lang}
          onConfirm={handleLogoutConfirm}
          onCancel={() => setShowLogoutModal(false)} />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
